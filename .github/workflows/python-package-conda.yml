name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          # Track patch updates in the README's tested Python minor version.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-evm.txt
      - name: Install core and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest flake8
          python -m pip check
      - name: Check Python syntax and undefined names
        run: >-
          python -m flake8 bcfl_contract scripts aggregate_results.py tests
          --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Test core behavior and mock CLI smoke run
        run: |
          mkdir -p ci-results
          python -m pytest tests -v --basetemp=ci-results/tests --junitxml=ci-results/pytest.xml
      - name: Check optional EVM dependencies
        run: |
          python -m pip install -r requirements-evm.txt
          python -m pip check
          python -c "from web3 import Web3; from solcx import compile_standard, install_solc, set_solc_version; from bcfl_contract.evm_chain import EVMCoordinator"
      - name: Record installed dependencies
        if: always()
        run: |
          mkdir -p ci-results
          python --version > ci-results/python-version.txt
          python -m pip freeze > ci-results/dependencies.txt
      - name: Upload test results and smoke outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-ci-results
          path: ci-results/
          retention-days: 7
